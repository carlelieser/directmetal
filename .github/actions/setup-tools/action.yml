name: Set up tools
description: Installs Python and the pinned Meson, Ninja, clang-format and ruff from tools/ci/requirements.txt.

runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.13"
        cache: pip
        cache-dependency-path: tools/ci/requirements.txt
    - name: Install tools
      shell: bash
      run: python -m pip install --disable-pip-version-check -r tools/ci/requirements.txt
