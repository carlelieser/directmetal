# Native file for x86_64 builds on Windows with a Windows-hosted LLVM-MinGW on PATH, used by
# .github/workflows/reference.yml. windows-llvm-mingw-i686.ini is its i686 counterpart.
[binaries]
c = 'x86_64-w64-mingw32-clang'
cpp = 'x86_64-w64-mingw32-clang++'
ar = 'x86_64-w64-mingw32-ar'
strip = 'x86_64-w64-mingw32-strip'
windres = 'x86_64-w64-mingw32-windres'
