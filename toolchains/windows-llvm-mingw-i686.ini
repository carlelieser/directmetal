# Cross file for i686 builds on x86_64 Windows with a Windows-hosted LLVM-MinGW on PATH. Windows
# runs the i686 programs directly, so no exe wrapper is needed.
[binaries]
c = 'i686-w64-mingw32-clang'
cpp = 'i686-w64-mingw32-clang++'
ar = 'i686-w64-mingw32-ar'
strip = 'i686-w64-mingw32-strip'
windres = 'i686-w64-mingw32-windres'

[host_machine]
system = 'windows'
cpu_family = 'x86'
cpu = 'i686'
endian = 'little'

[properties]
needs_exe_wrapper = false
