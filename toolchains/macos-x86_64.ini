[binaries]
c = ['xcrun', 'clang', '-arch', 'x86_64']
cpp = ['xcrun', 'clang++', '-arch', 'x86_64']
objcpp = ['xcrun', 'clang++', '-arch', 'x86_64']
ar = ['xcrun', 'ar']
strip = ['xcrun', 'strip']

[host_machine]
system = 'darwin'
subsystem = 'macos'
kernel = 'xnu'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[properties]
needs_exe_wrapper = false
